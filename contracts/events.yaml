contractVersion: 1.0.0
schemaVersion: 1
naming: bc.<context>.<entity>.<past-tense>
delivery:
  table: sys_outbox_event
  semantics: at-least-once
  consumerIdempotencyKey: eventId
  dispatcher: after transaction commit
commonPayloadFields:
  eventId: &id001
    type: string
    format: uuid
  occurredAt: &id002
    type: string
    format: date-time
  occurredBy: &id003
    type:
    - string
    - 'null'
    format: uuid
events:
- name: bc.registry.semester.created
  schemaVersion: 1
  producer:
    context: registry
    cards:
    - D01
  consumers:
  - context: governance
    cards:
    - D07
  aggregateType: Semester
  payload:
    type: object
    required:
    - eventId
    - occurredAt
    - occurredBy
    - semesterId
    - name
    - scheduleTemplateVersionId
    properties:
      eventId: *id001
      occurredAt: *id002
      occurredBy: *id003
      semesterId: *id001
      name:
        type: string
      scheduleTemplateVersionId: *id001
