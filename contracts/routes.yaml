contractVersion: 1.0.0
rolesDocument: roles.md
roleSourcePriority: [navigation, permissionMatrix, authenticated, public]
defaultLanding:
  ADMIN: /
  TEACHER: /me/timetable
loginRoute: /login
changePasswordRoute: /change-password
forbiddenRoute: /403
notFoundRoute: /404
navigationGroups:
- key: overview
  label: 系统概览
- key: basicData
  label: 基础数据
- key: scheduling
  label: 排课
- key: timetables
  label: 课表
- key: teacher
  label: 我的空间
- key: statistics
  label: 统计
- key: governance
  label: 治理与留痕
- key: identity
  label: 用户与角色
- key: exchange
  label: 数据交换
routes:
- path: /login
  name: login
  title: 登录
  component: frontend/src/views/auth/LoginView.vue
  accessSource: public
  roles: []
  requiresAuth: false
  menu: false
- path: /change-password
  name: change-password
  title: 修改密码
  component: frontend/src/views/auth/ChangePasswordView.vue
  accessSource: authenticated
  roles: [ADMIN, TEACHER]
  requiresAuth: true
  menu: false
- path: /403
  name: forbidden
  title: 权限不足
  component: frontend/src/views/auth/ForbiddenView.vue
  accessSource: authenticated
  roles: [ADMIN, TEACHER]
  requiresAuth: true
  menu: false
- path: /404
  name: not-found
  title: 页面不存在
  component: frontend/src/views/auth/NotFoundView.vue
  accessSource: authenticated
  roles: [ADMIN, TEACHER]
  requiresAuth: true
  menu: false
