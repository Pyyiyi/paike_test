  error_code:
    apiSchema: ErrorCode
    values:
    - VALIDATION_ERROR
    - UNAUTHENTICATED
    - FORBIDDEN
    - NOT_FOUND
    - VERSION_CONFLICT
    - DUPLICATE
    - REFERENCE_PROTECTED
    - STATE_CONFLICT
    - DRAFT_EXISTS
    - FILE_TOO_LARGE
    - IMPORT_ROW_ERROR
    - ACCOUNT_LOCKED
    - INTERNAL_ERROR
    - DATABASE_UNAVAILABLE
    labels:
      VALIDATION_ERROR: 保存失败，请检查输入内容
      UNAUTHENTICATED: 登录已失效，请重新登录
      FORBIDDEN: 您没有权限执行此操作
      NOT_FOUND: 未找到该数据，可能已被删除
      VERSION_CONFLICT: 数据已被他人修改，请刷新后重试
      DUPLICATE: 该名称已存在，请更换后重试
      REFERENCE_PROTECTED: 该数据正被使用，暂时无法删除
      STATE_CONFLICT: 当前状态不允许此操作
      DRAFT_EXISTS: 当前学期存在未保存草稿
      FILE_TOO_LARGE: 文件超过 20 MB，请拆分后重试
      IMPORT_ROW_ERROR: 文件中有无法导入的行
      ACCOUNT_LOCKED: 登录失败次数过多，请 15 分钟后再试
      INTERNAL_ERROR: 系统暂时不可用，请稍后重试
      DATABASE_UNAVAILABLE: 数据库暂时不可用，请稍后重试
    storage: API-only
    rule: 数据库、API、前端三处拼写完全一致
errorCodes:
  VALIDATION_ERROR:
    httpStatus: 400
    message: 保存失败，请检查输入内容
    when: 字段校验失败
  UNAUTHENTICATED:
    httpStatus: 401
    message: 登录已失效，请重新登录
    when: 无会话/会话过期
  FORBIDDEN:
    httpStatus: 403
    message: 您没有权限执行此操作
    when: 角色或数据范围不允许
  NOT_FOUND:
    httpStatus: 404
    message: 未找到该数据，可能已被删除
    when: 资源不存在
  VERSION_CONFLICT:
    httpStatus: 409
    message: 数据已被他人修改，请刷新后重试
    when: 乐观锁失败
  DUPLICATE:
    httpStatus: 409
    message: 该名称已存在，请更换后重试
    when: 唯一键冲突
  REFERENCE_PROTECTED:
    httpStatus: 409
    message: 该数据正被使用，暂时无法删除
    when: 引用保护
  STATE_CONFLICT:
    httpStatus: 409
    message: 当前状态不允许此操作
    when: 状态机守卫
  DRAFT_EXISTS:
    httpStatus: 409
    message: 当前学期存在未保存草稿
    when: 切换学期草稿守卫
  FILE_TOO_LARGE:
    httpStatus: 413
    message: 文件超过 20 MB，请拆分后重试
    when: 上传超限
  IMPORT_ROW_ERROR:
    httpStatus: 422
    message: 文件中有无法导入的行
    when: 导入部分失败
  ACCOUNT_LOCKED:
    httpStatus: 423
    message: 登录失败次数过多，请 15 分钟后再试
    when: 账号锁定
  INTERNAL_ERROR:
    httpStatus: 500
    message: 系统暂时不可用，请稍后重试
    when: 未预期异常
  DATABASE_UNAVAILABLE:
    httpStatus: 503
    message: 数据库暂时不可用，请稍后重试
    when: 数据库健康检查失败
