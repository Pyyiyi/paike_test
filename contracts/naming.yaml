  - walking_group
  - walking_group_member
  timetable:
  - timetable_plan
  - lesson
  - lesson_class
  - unscheduled_lesson
  - conflict_detail
  - conflict_ignore
  - adjustment_history
  governance:
  - operation_log
  - semester_archive
  identity:
  - sys_user
  exchange:
  - import_batch
  - print_template
