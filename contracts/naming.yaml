contractVersion: 1.0.0
enumRule: 数据库原生 enum、OpenAPI、前端展示标签使用同一拼写；禁止同义词作为枚举值
errorCodeRule: code 仅供程序判断，界面只展示 message
caseRules:
  database: snake_case
  api: camelCase
  events: bc.<context>.<entity>.<past-tense>
  frontendRoutes: kebab-case
roles:
  ADMIN: 教务管理员
  TEACHER: 普通教师
enumAliases:
