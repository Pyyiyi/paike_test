    - CLASSES
    - SUBJECTS
    - TEACHERS
    - ASSIGNMENTS
    - VENUES
    labels:
      SEMESTERS: 学期
      GRADES: 年级
      CLASSES: 班级
      SUBJECTS: 科目
      TEACHERS: 教师
      ASSIGNMENTS: 任课
      VENUES: 场地
