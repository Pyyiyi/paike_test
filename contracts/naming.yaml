      REQUIRED_HEADER_MISSING: 缺少必填列
      DUPLICATE_HEADER: 表头重复
      UNKNOWN_COLUMN: 未知列
      UNSUPPORTED_FORMAT: 不支持的文件格式
      UNSUPPORTED_ENCODING: 不支持的编码
      EMPTY_FILE: 文件没有数据
      PARSE_ERROR: 文件解析失败
      ROW_LIMIT_EXCEEDED: 数据行超过上限
      FILE_TOO_LARGE: 文件超过大小上限
      REQUIRED_VALUE_MISSING: 必填项为空
      INVALID_TYPE: 值类型不正确
      INVALID_FORMAT: 值格式不正确
      INVALID_ENUM: 值不在允许范围
      INVALID_DATE: 日期格式不正确
      VALUE_OUT_OF_RANGE: 值超出范围
      REFERENCE_NOT_FOUND: 引用数据不存在
      DUPLICATE_KEY: 数据已存在
      CROSS_FIELD_INVALID: 字段组合不合法
      INVALID_SLOT: 时段格式不正确
      CONTROLLED_VOCABULARY_MISMATCH: 名称不在受控词表
      DATABASE_FAILURE: 数据库写入失败
      TEMPLATE_NOT_FOUND: 模板不存在
      ERROR_REPORT_CONSUMED: 错误报告已下载
    rule: API-only；键与 OpenAPI ImportErrorCode 完全一致
  import_batch_status:
