  import_error_code:
    apiSchema: ImportErrorCode
    values:
    - REQUIRED_HEADER_MISSING
    - DUPLICATE_HEADER
    - UNKNOWN_COLUMN
    - UNSUPPORTED_FORMAT
    - UNSUPPORTED_ENCODING
    - EMPTY_FILE
    - PARSE_ERROR
    - ROW_LIMIT_EXCEEDED
    - FILE_TOO_LARGE
    - REQUIRED_VALUE_MISSING
    - INVALID_TYPE
    - INVALID_FORMAT
    - INVALID_ENUM
    - INVALID_DATE
    - VALUE_OUT_OF_RANGE
    - REFERENCE_NOT_FOUND
    - DUPLICATE_KEY
    - CROSS_FIELD_INVALID
    - INVALID_SLOT
    - CONTROLLED_VOCABULARY_MISMATCH
    - DATABASE_FAILURE
    - TEMPLATE_NOT_FOUND
    - ERROR_REPORT_CONSUMED
