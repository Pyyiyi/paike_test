        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '423':
          $ref: '#/components/responses/AccountLocked'
  /auth/logout:
    post:
      tags:
      - Auth
      summary: 退出登录
      operationId: logout
      x-phase: P0
      x-required-roles:
      - ADMIN
      - TEACHER
      security:
