components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: paike.sid
      description: 服务端会话 Cookie；HttpOnly、SameSite=Lax、生产 Secure
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: CSRF 双提交 Token；所有非 GET 请求必填
  schemas:
    Role:
      type: string
      enum:
      - ADMIN
      - TEACHER
      x-enum-name: Role
    AccountStatus:
      type: string
      enum:
      - ENABLED
      - DISABLED
      x-enum-name: AccountStatus
    Gender:
      type: string
      enum:
      - MALE
      - FEMALE
      - UNSPECIFIED
      x-enum-name: Gender
    SemesterStatus:
      type: string
      enum:
      - NOT_STARTED
      - IN_PROGRESS
      - ENDED
      - ARCHIVED
      x-enum-name: SemesterStatus
    Term:
      type: string
      enum:
      - FALL
      - SPRING
      x-enum-name: Term
    TemplateStatus:
      type: string
      enum:
      - ACTIVE
      - RETIRED
      x-enum-name: TemplateStatus
    CalendarExceptionType:
      type: string
      enum:
      - STOP
      - MAKEUP
      x-enum-name: CalendarExceptionType
    TeacherStatus:
      type: string
      enum:
      - ACTIVE
      - LEFT
      x-enum-name: TeacherStatus
    VenueType:
      type: string
      enum:
      - CLASSROOM
      - FUNCTION_ROOM
      x-enum-name: VenueType
    VenueStatus:
      type: string
      enum:
      - AVAILABLE
      - UNAVAILABLE
      x-enum-name: VenueStatus
    ConsecutivePreference:
      type: string
      enum:
      - NONE
      - PREFERRED
      - REQUIRED
      x-enum-name: ConsecutivePreference
    TimeSlotPreference:
      type: string
      enum:
      - NONE
      - MORNING
      - AFTERNOON
      x-enum-name: TimeSlotPreference
    PlanStatus:
      type: string
      enum:
      - DRAFT
      - PUBLISHED
      - SUPERSEDED
      - ARCHIVED
      x-enum-name: PlanStatus
    WeekParity:
      type: string
      enum:
      - ALL
      - ODD
      - EVEN
      x-enum-name: WeekParity
    SchedulingUnitType:
      type: string
      enum:
      - ASSIGNMENT
      - COMBINED_CLASS
      - WALKING_GROUP
      x-enum-name: SchedulingUnitType
    ConflictType:
      type: string
      enum:
      - TEACHER_OVERLAP
      - CLASS_OVERLAP
      - VENUE_OVERLAP
      - CAPACITY_EXCEEDED
      - LOCKED_VIOLATION
      - RULE_VIOLATION
      x-enum-name: ConflictType
    ConflictResolution:
      type: string
      enum:
      - UNRESOLVED
      - IGNORED_ONCE
      - CONFIG_CHANGED
      - RESOLVED
      x-enum-name: ConflictResolution
    UnscheduledReason:
      type: string
      enum:
      - NO_FEASIBLE_SLOT
      - TEACHER_EXHAUSTED
      - CLASS_EXHAUSTED
      - VENUE_EXHAUSTED
      - CAPACITY
      - LOCK_CONFLICT
      - TIME_LIMIT
      x-enum-name: UnscheduledReason
    AdjustmentAction:
      type: string
      enum:
      - APPLY
      - UNDO
      - REDO
      x-enum-name: AdjustmentAction
    ImportPreviewRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
      required:
      - file
    ImportExecuteRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
        confirm:
          type: boolean
          description: 前端二次确认后必须为 true
      required:
      - file
      - confirm
    ImportModule:
      type: string
      enum:
      - SEMESTERS
      - GRADES
      - CLASSES
      - SUBJECTS
      - TEACHERS
      - ASSIGNMENTS
      - VENUES
      x-enum-name: ImportModule
    ImportIssueSeverity:
      type: string
      enum:
      - ERROR
      - WARNING
      x-enum-name: ImportIssueSeverity
    ImportErrorCode:
      type: string
      enum:
      - REQUIRED_HEADER_MISSING
      - DUPLICATE_HEADER
      - UNKNOWN_COLUMN
      - UNSUPPORTED_FORMAT
      - UNSUPPORTED_ENCODING
      - EMPTY_FILE
      - PARSE_ERROR
      - ROW_LIMIT_EXCEEDED
      - FILE_TOO_LARGE
      - REQUIRED_VALUE_MISSING
      - INVALID_TYPE
      - INVALID_FORMAT
      - INVALID_ENUM
      - INVALID_DATE
      - VALUE_OUT_OF_RANGE
      - REFERENCE_NOT_FOUND
      - DUPLICATE_KEY
      - CROSS_FIELD_INVALID
      - INVALID_SLOT
      - CONTROLLED_VOCABULARY_MISMATCH
      - DATABASE_FAILURE
      - TEMPLATE_NOT_FOUND
      - ERROR_REPORT_CONSUMED
      x-enum-name: ImportErrorCode
    ImportBatchStatus:
      type: string
      enum:
      - COMPLETED
      - PARTIAL
      - FAILED
      x-enum-name: ImportBatchStatus
    ExportDimension:
      type: string
      enum:
      - MASTER_DATA
      - TIMETABLE
      - STATISTICS
      x-enum-name: ExportDimension
    TimetableDimension:
      type: string
      enum:
      - CLASS
      - TEACHER
      - SCHOOL
      - VENUE
