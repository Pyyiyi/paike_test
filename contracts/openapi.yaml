  responses:
    BadRequest:
      description: 请求参数或请求体校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthenticated:
      description: 会话缺失、失效或账号已停用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: 角色或数据范围不允许
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: 资源不存在或已被删除
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: 并发、唯一键、引用保护、状态机或草稿守卫冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooLarge:
      description: 上传文件超过 20 MB
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AccountLocked:
      description: 登录失败次数过多
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Internal:
      description: 未预期服务端异常
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unavailable:
      description: 数据库健康检查失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NoContent:
      description: 操作成功，无响应体
    XlsxFile:
      description: XLSX 文件
      content:
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema:
            type: string
            format: binary
    CsvFile:
      description: UTF-8 BOM CSV 文件（一次性下载）
      content:
        text/csv:
          schema:
            type: string
            format: binary
    PdfFile:
      description: PDF 文件
      content:
        application/pdf:
          schema:
            type: string
            format: binary
