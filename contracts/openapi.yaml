openapi: 3.1.0
info:
  title: 智能排课系统 V1.0 API
  version: 1.0.0
  description: 契约冻结版本。所有 Phase 0-3 API 的唯一实现依据；偏离必须先更新契约。
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  x-contract-version: 1.0.0
  x-api-base-path: /api/v1
servers:
- url: /api/v1
  description: 版本化 API 基础路径
tags:
- name: Health
  description: 健康检查
- name: Auth
  description: 认证、会话与改密
- name: Registry
  description: 学期、作息、年级班级、科目
- name: Resource
  description: 教师任课、场地、合班走班
- name: Timetable
  description: 排课方案、调课、五视图、空闲时段
- name: Statistics
  description: 工作量统计
- name: Governance
  description: 操作日志、学期存档与切换
- name: Identity
  description: 用户、角色与账号生命周期
- name: Exchange
  description: 批量导入与 Excel 导出
- name: Print
  description: 打印模板与 PDF 渲染
security:
- cookieAuth: []
paths:
  /health:
    get:
      tags:
      - Health
      summary: 健康检查
      operationId: getHealth
      x-phase: P0
      x-required-roles:
      - ADMIN
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/csrf:
    get:
      tags:
      - Auth
      summary: 获取 CSRF Token
      operationId: getCsrfToken
      x-phase: P0
      x-required-roles:
      - ADMIN
      - TEACHER
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
